# Polytoken Configuration Layer for Swarm Orchestration
# Subagents in .polytoken/subagents/*.md and skills in .polytoken/skills/*/SKILL.md
# are auto-discovered by Polytoken from this configuration root.

mcp_servers:
  swarm:
    transport: stdio
    command: python3
    args:
      - "-m"
      - "pt_swarm.mcp_server"
    env:
      POLYTOKEN_SWARM_DIR: "./.swarm/default"
      POLYTOKEN_AGENT_NAME: "coordinator"
