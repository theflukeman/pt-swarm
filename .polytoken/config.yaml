# Polytoken Configuration Layer for Swarm Orchestration
# Subagents in .polytoken/subagents/*.md and skills in .polytoken/skills/*/SKILL.md
# are auto-discovered by Polytoken from this configuration root.

mcp_servers:
  swarm:
    transport: stdio
    command: python3
    args:
      - "-m"
      - "pt_swarm.mcp_server"
    env:
      POLYTOKEN_SWARM_DIR: "./.swarm/default"
      POLYTOKEN_AGENT_NAME: "coordinator"
    # Polytoken's global config references provider credentials by name
    # ($NEURALWATT_API_KEY and friends), so a stdio child without them cannot load
    # that config at all -- and workers inherit this child's environment, which
    # means every `polytoken exec` spawn fails before it starts.
    pass_env:
      - NEURALWATT_API_KEY
      - EXA_API_KEY
      - TAVILY_API_KEY
