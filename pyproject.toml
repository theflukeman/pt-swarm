[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pt-swarm"
version = "1.0.0"
description = "Unofficial port of the Antigravity Native Swarm skill, MCP server, tools, and UI for the Polytoken harness."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "theflukeman" }]
keywords = ["swarm", "multi-agent", "polytoken", "mcp", "orchestration", "collaboration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.scripts]
pt-swarm-mcp = "pt_swarm.mcp_server:main"
pt-swarm-cli = "pt_swarm.cli:main"

[tool.setuptools.packages.find]
include = ["pt_swarm*"]

[tool.setuptools.package-data]
pt_swarm = [
    "agent_definitions/*.md",
    "tool_schemas/*.json",
    "config.example.json",
]
